<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Independent CS526 Mobile Application Development study hub: lecture reviews, essay preparation and practice quizzes for the midterm." />
    <meta name="theme-color" content="#f3f7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111814" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CS526 Study Hub</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem("cs526:theme"); } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (theme === "dark") document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This study hub needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
